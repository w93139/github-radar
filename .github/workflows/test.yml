name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile collector
        run: python -m py_compile scripts/github_radar.py
      - name: Run unit tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Enforce read-only GitHub access
        run: python -m unittest scripts.tests.test_github_radar.GitHubRadarTests.test_read_only_endpoint_guard -v
